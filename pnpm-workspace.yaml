packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@opentelemetry/propagator-jaeger": ^2.9.0
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 affects every release through
  # 5.0.7, including the legacy 1.x line still used by minimatch@3.
  # 5.0.8 retains CommonJS support for those consumers.
  brace-expansion: ^5.0.9
  dompurify: ^3.4.12
  fast-uri: ^3.1.5
  postcss: ^8.5.18
  protobufjs: ^8.6.6
  sharp: ^0.35.0
  vite: ^7.3.5
allowBuilds:
  "@sentry/cli": false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
