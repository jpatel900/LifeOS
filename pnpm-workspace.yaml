packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@grpc/grpc-js": ^1.14.5
  # Sentry's artifact matcher still requests glob 13. Limit the exception to this consumer.
  "@sentry/bundler-plugin-core@5.3.0>glob": 14.0.2
  # The TypeScript parser calls the named minimatch function on project globs.
  "@typescript-eslint/typescript-estree@8.59.2>minimatch": 11.0.1
  "@opentelemetry/propagator-jaeger": ^2.9.0
  baseline-browser-mapping: ^2.11.0
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 affects every release through
  # 5.0.7, including the legacy 1.x line still used by minimatch@3.
  # 5.0.8 retains CommonJS support for those consumers.
  brace-expansion: ^5.0.12
  browserslist: ^4.28.7
  dompurify: ^3.4.16
  fflate: ^0.4.9
  fast-uri: ^3.1.9
  js-yaml: ^4.3.2
  nanoid: ^3.3.18
  postcss: ^8.5.18
  protobufjs: ^8.6.6
  sharp: ^0.35.0
  smol-toml: ^1.9.1
  source-map-js: ^1.2.2
  vite: 7.3.7
  "zod@>=4 <4.6.6": 4.6.6
allowBuilds:
  "@sentry/cli": false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
