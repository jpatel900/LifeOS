packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@opentelemetry/propagator-jaeger": ^2.9.0
  # Scoped to the 1.x consumer (minimatch@3) on purpose: 1.1.16 is the
  # terminal 1.x release (no 1.1.17 was ever cut; npm dist-tag
  # maintenance-v1 still points at 1.1.16). An unscoped override would
  # drag the 5.x line down to 1.1.16 and break minimatch@10.
  "brace-expansion@1": ^1.1.16
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 (DoS via unbounded expansion
  # length): the fix lives entirely in src/index.ts, the TS rewrite that
  # postdates the legacy 1.x JS implementation by several majors, so the
  # 1.x pin above is not known to share this bug. Scoped to the 5.x
  # consumer (minimatch@10) so it doesn't collide with the 1.x pin.
  "brace-expansion@5": ^5.0.8
  dompurify: ^3.4.12
  fast-uri: ^3.1.4
  postcss: ^8.5.18
  protobufjs: ^8.6.6
  sharp: ^0.35.0
  vite: ^7.3.5
allowBuilds:
  "@sentry/cli": false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
