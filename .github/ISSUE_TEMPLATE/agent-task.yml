name: Agent Task
description: Create an agent-ready LifeOS task. AGENTS.md governs; this issue body is the contract.
title: "[Agent Task] "
body:
  - type: markdown
    attributes:
      value: |
        `AGENTS.md` red lines and owner gates apply to every task. If the work touches a Human review surface (schema, RLS, auth, OAuth, calendar writes, observability privacy, production deployment), the agent may build it and declares it in the PR as an `OWNER-GATE`.
  - type: dropdown
    id: risk_level
    attributes:
      label: Risk level
      options:
        - low
        - medium
        - high
        - blocked-human-decision
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and why
      description: The exact outcome and the user or product cost of leaving it undone. Name the requirement, ADR, or invariant it answers to.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete, checkable outcomes, including what must stay unchanged.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: The commands or browser checks that show it works (CI runs the full floor). UI work names the screens to check on mobile and desktop.
    validations:
      required: false
  - type: textarea
    id: notes_context
    attributes:
      label: Notes
      description: Expected files, known pitfalls, linked issues, non-goals.
    validations:
      required: false
