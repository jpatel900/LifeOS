name: Safe Auto-merge

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
        edited,
      ]

# Shared by every writer caller. Queue pending revocations instead of replacing
# them, and never cancel an active write. Fork branch names get separate groups.
concurrency:
  group: pr-automerge-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sync-safe-automerge:
    name: Sync safe auto-merge state
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    steps:
      - name: Checkout trusted policy and writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR commits for read-only diff evaluation
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Evaluate safe auto-merge eligibility
        id: eligibility
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/agent/check-safe-automerge.mjs

      # Always hand over failures too, so old approval cannot survive a crash.
      - name: Hand verdict to the sole auto-merge writer
        id: writer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAFE_VERDICT: ${{ steps.eligibility.outcome == 'success' && steps.eligibility.outputs.verdict || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Keep the existing entry point across cutover: before this owner-merged
        # change reaches main, its trusted writer still has the old --notify CLI.
        run: node scripts/agent/selfmerge-window.mjs --notify

      # Checkout can fail before the writer exists. Recover trusted main code
      # through the API, without adding a second owner of merge mutations.
      - name: Revoke after a failed writer handoff
        if: always() && steps.writer.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          script: |
            const { mkdtemp, writeFile, rm } = require('node:fs/promises');
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            if (ref.object?.type !== 'commit' || !/^[a-f0-9]{40}$/i.test(ref.object.sha)) {
              throw new Error('Could not resolve the trusted main writer revision.');
            }
            const directory = await mkdtemp(join(process.env.RUNNER_TEMP, 'automerge-revoke-'));
            try {
              for (const file of [
                'selfmerge-window.mjs', 'check-safe-automerge.mjs',
                'red-guard-diagnose.mjs', 'automation-policy.mjs',
              ]) {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path: 'scripts/agent/' + file, ref: ref.object.sha,
                });
                if (data.type !== 'file' || data.encoding !== 'base64' || typeof data.content !== 'string') {
                  throw new Error('Could not load trusted writer dependency: ' + file);
                }
                const source = Buffer.from(data.content, 'base64').toString('utf8');
                // Before owner merge, main still has the legacy unconditional CLI.
                // Refuse to import it: its --notify/--scan paths may arm a PR.
                if (file === 'selfmerge-window.mjs' && !/export function writeAutoMerge\(/.test(source)) {
                  throw new Error('Trusted main does not yet expose the sole auto-merge writer.');
                }
                await writeFile(join(directory, file), source);
              }
              const { writeAutoMerge } = await import(pathToFileURL(join(directory, 'selfmerge-window.mjs')).href);
              const result = writeAutoMerge({
                id: context.payload.pull_request.node_id, enabled: false,
              });
              core.info('Checkout-independent revocation: ' + result.action);
            } finally {
              await rm(directory, { recursive: true, force: true });
            }
