# Detects the KNOWN_ISSUES row 11 failure mode: app deploys (Vercel, on merge)
# outrunning the production database, which only changes via a manual
# `supabase db push`. Detection only — it never applies DDL to production.
#
# Checks BOTH directions (added 2026-08-21 — see docs/FAILURES.md, "A
# migration went unseen for a month: the drift detector only looked one
# way"): repo-ahead (a repo file not yet applied to prod — the original
# behavior) AND prod-ahead (a prod ledger version with no repo file — how
# 20260718184244_security_harden_functions sat undetected in production for
# a month). The comparison lives in scripts/agent/check-migration-drift.mjs;
# known/expected prod-only versions (this Supabase project is shared with
# the RiseUp Cockpit project) are listed with a reason each in
# scripts/agent/migration-drift-allowlist.mjs — an unlisted prod-only
# version still fails this check loudly.
#
# Requires one repository secret to do real work: SUPABASE_PROD_DB_URL — a
# Postgres connection string for the prod project (Supabase dashboard ->
# Connect -> Session pooler). Prefer a read-only role; the job only reads
# supabase_migrations.schema_migrations.
#
# A missing secret FAILS the check on push-to-main (and on the migration-apply
# re-dispatch) — this guard must not be silently disarmable by an unset
# secret. The only way to skip is an explicit manual workflow_dispatch with
# allow_skip=true.
name: Migration Drift

# Runs on every push to main (not just migration paths) so an unresolved red
# re-fires on each merge until production is caught up. The check takes ~5s.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_skip:
        description: "Skip the check if SUPABASE_PROD_DB_URL is unset (manual dispatch only; never honored on push)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  drift:
    name: Prod migration drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          # this job never installs pnpm, so setup-node must not try to use
          # it for caching (it auto-detects the packageManager field)
          package-manager-cache: false

      - name: check-migration-drift self-test
        run: node scripts/agent/check-migration-drift.mjs --self-test

      - name: Compare repo migrations against production (both directions)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_SKIP: ${{ github.event.inputs.allow_skip }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_SKIP" = "true" ]; then
              echo "::warning::SUPABASE_PROD_DB_URL secret is not set; skipping the drift check (allow_skip=true on manual dispatch)."
              exit 0
            fi

            echo "::error::SUPABASE_PROD_DB_URL secret is not set, so the migration drift guard is disarmed. This check must not silently pass — set the secret, or if this is a deliberate manual skip, re-run via workflow_dispatch with allow_skip=true."
            exit 1
          fi

          remote_ledger="$RUNNER_TEMP/prod-migration-ledger.tsv"
          psql "$PROD_DB_URL" -t -A -F $'\t' -c \
            "select version, name from supabase_migrations.schema_migrations order by version" \
            > "$remote_ledger"

          node scripts/agent/check-migration-drift.mjs --remote-file "$remote_ledger"
