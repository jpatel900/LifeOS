name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same PR supersedes the previous run — cancel it instead
# of paying for both. Pushes to main keep distinct groups (never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect heavy-relevant changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Event ${{ github.event_name }}: running full suite."
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(apps/web/|supabase/)'; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "apps/web or supabase changed: e2e + migrations-rls will run."
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "No apps/web or supabase changes: e2e + migrations-rls will be skipped for this PR."
          fi

  automerge-policy-self-tests:
    name: Safe-automerge policy self-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          # this job never installs pnpm, so setup-node must not try to use
          # it for caching (it auto-detects the packageManager field)
          package-manager-cache: false

      # No pnpm install: these scripts are dependency-free by design so the
      # Level-5 automerge policy gate can never be skipped for cost reasons.
      - name: check-safe-automerge self-test
        run: node scripts/agent/check-safe-automerge.mjs --self-test

      - name: selfmerge-window self-test
        run: node scripts/agent/selfmerge-window.mjs --self-test

      - name: safe-automerge-demotion self-test
        run: node scripts/agent/safe-automerge-demotion.mjs --self-test

      - name: low-risk issue authorization self-test
        run: node scripts/agent/low-risk-issue-policy.mjs --self-test

      - name: red-guard diagnosis self-test
        run: node scripts/agent/red-guard-diagnose.mjs --self-test

      - name: turbo test-inputs coverage self-test
        run: node scripts/agent/check-turbo-test-inputs.mjs --self-test

      - name: check-migration-drift self-test
        run: node scripts/agent/check-migration-drift.mjs --self-test

  migration-timestamp-collision:
    name: Migration timestamp collision precheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # full history so origin/<base branch> is resolvable for the diff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          # this job never installs pnpm, so setup-node must not try to use
          # it for caching (it auto-detects the packageManager field)
          package-manager-cache: false

      # No pnpm install: the script is dependency-free by design. Catches a PR
      # whose new supabase/migrations timestamp collides with the base branch
      # BEFORE merge — post-merge, production silently skips one of the two
      # files (#762/#764 on 2026-07-26; see issue #776).
      - name: check-migration-collision self-test
        run: node scripts/agent/check-migration-collision.mjs --self-test

      - name: Fail on migration timestamp collision with base branch
        run: node scripts/agent/check-migration-collision.mjs --base "origin/${{ github.base_ref }}"

  validate-monorepo:
    name: Monorepo Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # Real (non-self-test) run of scripts/agent/check-turbo-test-inputs.mjs:
      # re-derives, from the actual apps/web/src test tree, every repo-root
      # path (docs/**, supabase/**, .github/, .agents/, .cursor/, scripts/,
      # root markdown) a guard test reads via a repoRoot-relative fs call or
      # docLinkIntegrity's PATH_PATTERN allowlist, and fails if turbo.json's
      # `test` task inputs (below the "Test" step) don't cover one. Catches a
      # future guard-test edit that starts scanning a new top-level directory
      # -- or a turbo.json edit that drops coverage -- before it can silently
      # reopen the docs-only-change-hits-a-stale-cached-PASS gap (2026-08-21,
      # docs/FAILURES.md). The --self-test variant above only pins the pure
      # parsing functions against synthetic fixtures; this is the check that
      # actually enforces coverage against the live repo on every PR.
      - name: Turbo test-inputs coverage (guards the docs/publicEvidenceHygiene cache gap)
        run: node scripts/agent/check-turbo-test-inputs.mjs

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check

      # Architecture boundaries as CI rules (chore/adopt-dependency-cruiser).
      # `pnpm depcruise` runs scripts/agent/run-depcruise.mjs, which cruises
      # apps/web and packages/* with .dependency-cruiser.cjs and fails on
      # any error-severity rule violation. It also carries its own
      # vacuous-pass guard: it reads each cruise's `--output-type json`
      # module count and fails if apps/web sees fewer than 500 modules or
      # packages sees fewer than 20 -- the signature of a cruise that
      # silently resolved nothing (the exact npx/pnpm-hoisting failure mode
      # this PR's setup notes call out) while still exiting 0.
      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm depcruise

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    # Uses the official semgrep/semgrep container image (no SEMGREP_APP_TOKEN
    # / semgrep ci needed for local rules): https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
    # "container: image: semgrep/semgrep" + "semgrep scan --config ...".
    # Pinned to the version verified locally (1.172.0) so CI reproduces the
    # same finding counts as the pre-merge verification for this job.
    container:
      image: semgrep/semgrep:1.172.0
    # No path filter: this scans the whole apps/packages workspace tree for
    # rule violations, same as Lint/Type-check/Test/Build above, which are
    # also unconditional. The `changes` job's `heavy` gate only tracks
    # apps/web/ and supabase/ (it exists to skip Playwright/Supabase e2e
    # infra), so gating on it here would silently skip packages/-only PRs.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # BLOCKING: bans hand-typed WorkflowState annotations in test files
      # repo-wide (issue #859). Paths are pinned to "apps packages" -- never
      # bare repo root -- because semgrep's default ignore silently skips
      # dirs named test/ or tests/.
      - name: Enforce WorkflowState test-annotation ban
        run: >
          semgrep scan --config .semgrep/no-workflowstate-annotation-in-tests.yaml
          --metrics=off --error apps packages

      # BLOCKING: bans z.string().datetime() without { offset: true } (the exact gap
      # that silently killed the calendar integration for 2 months, 2026-07-25 incident).
      # This check is now blocking following fix #858's merge.
      - name: Semgrep - datetime offset rule (blocking)
        run: >
          semgrep scan --config .semgrep/zod-datetime-requires-offset.yaml
          --metrics=off --error apps packages

  e2e:
    name: Playwright E2E
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @lifeos/web exec playwright install --with-deps msedge

      # `--grep-invert @signed-in` excludes the signed-in tier, which needs a
      # Supabase-backed server this job deliberately does not have. Those specs
      # run in `e2e-signed-in` below. Everything else is unchanged: no
      # device-tier spec left this job.
      - name: Run Playwright E2E suite (device tier)
        run: pnpm --filter @lifeos/web test:e2e --grep-invert "@signed-in"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  e2e-signed-in:
    # The seam #737's ROUND 3 re-score recorded and could not close:
    #
    #   "The CI `e2e` job still sets no Supabase env, so every Playwright pin
    #    outside `migrations-rls` runs device-tier only. […] the other criteria
    #    are still pinned at two tiers that never meet in a signed-in browser.
    #    This drive is the only account-tier browser evidence for them, and a
    #    drive is not a pin. Recommend a lane of its own: an `e2e` job with
    #    Supabase env."
    #
    # This is that job. It is a SEPARATE job on purpose rather than extra steps
    # inside `migrations-rls`: a browser-journey failure must not redden a check
    # named "Migrations + RLS Verification", and the owner needs an
    # independently named signal for the signed-in tier.
    #
    # The budget is held by `--grep`, not by sharing a runner: only the four
    # `@signed-in` specs run here (one per C1 criterion family). The whole
    # Playwright suite is NOT run twice.
    name: Playwright E2E (signed-in tier)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @lifeos/web exec playwright install --with-deps msedge

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # same pin as `migrations-rls` — bump the two together, deliberately
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and seed from scratch
        run: supabase db reset

      # ONE `run:` block on purpose. `supabase status -o env` is evaluated into
      # this shell, and environment set in one step does not cross into the
      # next — splitting this would start the dev server with no Supabase env
      # and produce a green run of a signed-OUT suite, which is precisely the
      # vacuity this job exists to end. `tests/e2e/helpers/signedInAccount.ts`
      # carries a second guard (`requireSupabaseEnv`) that fails loudly if the
      # env is ever missing anyway.
      - name: Run the signed-in Playwright tier against the live local stack
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          pnpm --filter @lifeos/web test:e2e --grep "@signed-in"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-signed-in
          path: apps/web/test-results/
          retention-days: 7

  migrations-rls:
    name: Migrations + RLS Verification
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # pinned for reproducibility — bump deliberately (was `latest`, which
          # let CI silently pick up upstream CLI changes on every run)
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and seed from scratch
        run: supabase db reset

      - name: Run RLS suite against live local database
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          RUN_SUPABASE_RLS_TESTS=1 \
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          pnpm --filter @lifeos/web test phase4aRls.local
