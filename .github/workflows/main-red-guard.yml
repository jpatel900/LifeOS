name: Main Red Guard

# Safety net for merging PRs without the strict up-to-date requirement:
# if CI fails on a push to main (e.g. two individually-green PRs conflict
# semantically), first retry the failed jobs once (flake guard). If the
# failure reproduces, open a revert PR back to the last green commit.
#
# Owner decision 2026-08-05 — "notify and hold + automatic stand-down + a
# diagnosis step": the revert PR is NEVER auto-armed. On 2026-08-05 the guard
# armed PR #841 against 5 commits (an app re-land plus 4 docs-only commits)
# over what the evidence said was tier nondeterminism; only the revert's own
# coincidentally-red CI stopped it from landing. So now:
#   - the revert PR opens HELD; nothing merges until a human adds
#     `revert:confirm` (closing the PR still cancels the revert),
#   - a diagnosis step reads every attempt of the failed run and says, in
#     plain language, whether the change or the environment is suspect,
#   - if the revert's own CI fails the SAME job that made main red, the guard
#     stands down on its own: `revert:wont-fix` + a comment, and it disarms
#     auto-merge if a human had already confirmed.
# Detection is unchanged: double-red still triggers, and both safe-automerge
# demotion jobs below are untouched.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled

concurrency:
  group: main-red-guard-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  flake-guard:
    name: Retry first failure once
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-run failed jobs before trusting the red
        env:
          # github.token, NOT the kick PAT: rerunning needs actions:write, which this
          # workflow grants to github.token. The Issues+PRs-scoped PAT got
          # "Resource not accessible by personal access token" on 2026-07-04
          # (run 28708134672), so the flake retry never happened and the
          # auto-revert (gated on run_attempt >= 2) could never arm.
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
          echo "Red main at attempt 1: re-ran failed jobs. Only a reproduced failure (attempt 2+) triggers the auto-revert."

  guard:
    name: Open a HELD revert PR when main stays red
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt >= 2
    steps:
      - name: Checkout main history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # github.token, NOT the kick PAT: the checkout token becomes the
          # persisted credential `git push origin guard/revert-main-*` uses.
          # The Issues+PRs-scoped kick PAT lacks contents:write and 403'd the
          # push on 2026-07-09 (run 29055368826, "denied to jpatel900") — the
          # revert silently never landed. github.token has the contents:write
          # this workflow's permissions grant. PR creation below still uses
          # the kick PAT so the revert PR's own checks actually trigger.
          token: ${{ github.token }}

      - name: Skip if a guard revert PR is already open
        id: dedupe
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = prs.data.find((pr) =>
              pr.head.ref.startsWith('guard/revert-main-'),
            );
            core.setOutput('skip', existing ? 'true' : 'false');
            if (existing) {
              core.notice(`Guard revert PR already open: ${existing.html_url}`);
            }

      - name: Find last green main commit
        if: steps.dedupe.outputs.skip != 'true'
        id: green
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          script: |
            const failedSha = context.payload.workflow_run.head_sha;
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              status: 'success',
              per_page: 50,
            });
            const green = runs.data.workflow_runs.find(
              (r) => r.name === 'CI' && r.head_sha !== failedSha,
            );
            core.setOutput('sha', green ? green.head_sha : '');
            core.setOutput('failed_sha', failedSha);

      - name: Create revert branch and PR
        if: steps.dedupe.outputs.skip != 'true'
        id: revert
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          GREEN_SHA: ${{ steps.green.outputs.sha }}
          FAILED_SHA: ${{ steps.green.outputs.failed_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # Written into the PR body as a marker so the stand-down job can
          # still find the failed run even if the diagnosis step never lands
          # its comment. Without this, a failed diagnosis would silently make
          # stand-down inert — reopening the #841 destruction path for anyone
          # who then adds `revert:confirm`.
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git config user.name "main-red-guard[bot]"
          git config user.email "main-red-guard@users.noreply.github.com"

          short="${FAILED_SHA:0:8}"
          branch="guard/revert-main-${short}"

          # Fall back to the parent commit when no prior green run is known.
          base="${GREEN_SHA:-$(git rev-parse "${FAILED_SHA}^")}"

          if ! git merge-base --is-ancestor "$base" "$FAILED_SHA"; then
            base="$(git rev-parse "${FAILED_SHA}^")"
          fi

          commits="$(git log --oneline "${base}..${FAILED_SHA}" | head -20)"
          echo "Reverting range ${base}..${FAILED_SHA}:"
          echo "$commits"

          git switch -c "$branch" "$FAILED_SHA"
          if git revert --no-commit "${base}..${FAILED_SHA}"; then
            git commit -m "Revert main to last green (${base:0:8}) after red CI at ${short}"
            git push origin "$branch"
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Auto-revert: main went red at ${short}" \
              --body "$(printf 'CI failed on main twice (original + flake-guard retry): %s\n\nThis PR reverts main back to the last green commit `%s`.\n\n**This revert is HELD — nothing merges until a human adds the `revert:confirm` label. Close this PR to cancel the revert.**\n\nBefore confirming, read the diagnosis comment below: it says whether the failure looks like the change or like a flaky test tier. If this revert PR fails the same job that made main red, the guard labels it `revert:wont-fix` and a revert cannot fix main.\n\nReverted commits:\n```\n%s\n```\n\nOpened automatically by Main Red Guard (owner decision 2026-08-05: notify and hold + automatic stand-down + a diagnosis step).\n\n<!-- red-guard-diagnosis: {"failedRunId":"%s"} -->' "$RUN_URL" "${base:0:8}" "$commits" "$RUN_ID")")"
            echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          else
            git revert --abort || true
            gh issue create \
              --title "main is red at ${short} and auto-revert could not apply" \
              --body "$(printf 'CI failed on main: %s\n\nAutomatic revert of `%s..%s` hit conflicts, so no revert PR was opened. Manual intervention needed.\n\nCommits since last green:\n```\n%s\n```' "$RUN_URL" "${base:0:8}" "$short" "$commits")"
          fi

      # Diagnosis is advisory: it must never stop the revert PR from existing,
      # so both steps are continue-on-error AND the script exits 0 on its own
      # failures, degrading to "diagnosis unavailable: <reason>".
      - name: Set up Node.js for the diagnosis step
        if: steps.dedupe.outputs.skip != 'true' && steps.revert.outputs.pr_url != ''
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          # dependency-free script, same as the policy self-test job
          package-manager-cache: false

      - name: Diagnose the red and post it on the held revert PR
        if: steps.dedupe.outputs.skip != 'true' && steps.revert.outputs.pr_url != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED_SHA: ${{ steps.green.outputs.failed_sha }}
          PR_URL: ${{ steps.revert.outputs.pr_url }}
        run: |
          # The workspace is still on the revert branch here. When the reverted
          # range touches the guard's own files, the revert has DELETED this
          # script from disk — the guard's first live firing (#845, reverting
          # #843 itself) died exactly this way. Restore the script from the
          # commit being diagnosed before running it.
          git checkout "$FAILED_SHA" -- scripts/agent/red-guard-diagnose.mjs || true
          if ! node scripts/agent/red-guard-diagnose.mjs \
            --diagnose \
            --repo "${{ github.repository }}" \
            --pr "$PR_URL" \
            --run-id "${{ github.event.workflow_run.id }}"; then
            # Degrade at the WORKFLOW level: the script's own degrade path
            # cannot run if the script is missing or crashed on load.
            gh pr comment "$PR_URL" --body "Diagnosis unavailable: the diagnosis step itself failed in the guard run — open the failed CI run linked in the PR body and read it directly before confirming this revert. The stand-down safety (PR-body marker) still applies."
          fi

  confirm-to-arm:
    name: Arm auto-merge when a human confirms the revert
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'revert:confirm' &&
      startsWith(github.event.pull_request.head.ref, 'guard/revert-main-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Run the guard's script from main, never from the PR merge ref: a
          # guard revert that touches the guard's own files DELETES this script
          # from the merge ref, which would break confirmation exactly when it
          # is most sensitive (same failure family as #845's missing diagnosis).
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          package-manager-cache: false

      # Arms only when `revert:confirm` is present and `revert:wont-fix` is
      # absent; the conflicting-label case gets an explaining comment instead.
      - name: Evaluate the confirmation
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
        run: |
          node scripts/agent/red-guard-diagnose.mjs \
            --confirm-arm \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

  stand-down:
    name: Stand down when the revert does not fix main
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'guard/revert-main-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Explicit for the same reason as confirm-to-arm: the guard's script
          # always runs from main's trusted, present copy.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Compare the revert's failures with the failures that reddened main
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" \
            --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            echo "No open guard revert PR for ${HEAD_BRANCH}; nothing to stand down."
            exit 0
          fi
          node scripts/agent/red-guard-diagnose.mjs \
            --stand-down \
            --repo "${{ github.repository }}" \
            --pr "$pr" \
            --revert-run-id "${{ github.event.workflow_run.id }}"

  demote-red-main-safe-automerge-class:
    name: Open safe auto-merge class demotion PR after red main
    runs-on: ubuntu-latest
    needs: guard
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt >= 2
    steps:
      - name: Checkout main history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # github.token for git pushes (kick PAT lacks contents:write — same
          # 403 class as the guard job's 2026-07-09 failure).
          token: ${{ github.token }}

      - name: Open demotion PR for implicated safe auto-merge class
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
        run: |
          node scripts/agent/safe-automerge-demotion.mjs \
            --trigger-kind red-main \
            --trigger-url "${{ github.event.workflow_run.html_url }}" \
            --implicated-sha "${{ github.event.workflow_run.head_sha }}"

  demote-reverted-safe-automerge-class:
    name: Open safe auto-merge class demotion PR after revert
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # github.token for git pushes (kick PAT lacks contents:write — same
          # 403 class as the guard job's 2026-07-09 failure).
          token: ${{ github.token }}

      - name: Open demotion PR for reverted safe auto-merge class
        env:
          GH_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CODEX_KICK_TOKEN || github.token }}
        run: |
          node scripts/agent/safe-automerge-demotion.mjs \
            --trigger-kind revert \
            --trigger-url "${{ github.event.compare }}" \
            --revert-sha "${{ github.sha }}"
