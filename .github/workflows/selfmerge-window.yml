name: Self-merge window

# PR changes enter through Safe Auto-merge. CI and manual sweeps use the same
# owner, including PRs whose opt-in labels were removed after approval.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: List open PRs
        id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const candidates = prs.filter(pr => pr.auto_merge || pr.labels.some(label =>
              /^(automerge:|selfmerge:)/.test(label.name) || label.name === 'revert:confirm'));
            if (candidates.length > 256) throw new Error('Too many candidate PRs for one matrix; refusing a partial scan.');
            core.setOutput('prs', JSON.stringify(candidates.map(pr => ({ number: pr.number, head: pr.head.ref, repo: pr.head.repo?.full_name ?? context.repo.owner + '/' + context.repo.repo }))));

  reconcile:
    needs: candidates
    if: needs.candidates.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.candidates.outputs.prs) }}
    concurrency:
      group: pr-automerge-${{ matrix.pr.repo }}-${{ matrix.pr.head }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout trusted policy and writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Reconcile current eligibility and notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr.number }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/agent/selfmerge-window.mjs --reconcile
